[workspace]
members = [
    "crates/ahcl-kit-core",
    "crates/ahcl-kit-fs",
    "crates/ahcl-kit-config",
    "crates/ahcl-kit-license",
    "crates/ahcl-kit-cargo",
    "crates/ahcl-kit-javascript",
    "crates/ahcl-kit-materials",
    "crates/ahcl-kit-cli",
    "crates/ahcl-kit",
    "assets/packaging",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Aperip Daedalus Foundation"]
description = "Initialize, generate, and maintain AHCL materials for projects"
homepage = "https://ahcl.aperip.com"
license = "AHCL-1.2"
repository = "https://github.com/Aperip-Daedalus-Foundation/ahcl-kit"

[workspace.metadata.ahcl-kit]
product-name = "AHCL Kit"
binary-name = "ahcl"
publisher = "Aperip Daedalus Foundation"
copyright = "Copyright (C) 2026 Aperip Daedalus Foundation. All rights reserved."
identifier = "com.aperip.ahcl-kit"
language = "neutral"
