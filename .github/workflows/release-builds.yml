name: Release builds

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect an untagged workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(python3 - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version'])
          PY
          )"
          tag="v$current"
          exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then exists=true; fi
          release_needed=false
          if [[ "$exists" == false ]]; then release_needed=true; fi
          {
            echo "version=$current"
            echo "tag=$tag"
            echo "release_needed=$release_needed"
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [version, quality]
    if: needs.version.outputs.release_needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: >-
          cargo run --locked --package ahcl-kit-dist --
          windows
          --architecture '${{ matrix.architecture }}'
          --target '${{ matrix.target }}'
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: dist/*.msi
          if-no-files-found: error

  macos:
    needs: [version, quality]
    if: needs.version.outputs.release_needed == 'true'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Universal PKG
        run: cargo run --locked --package ahcl-kit-dist -- macos
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-apple-darwin
          path: dist/*.pkg
          if-no-files-found: error

  linux:
    needs: [version, quality]
    if: needs.version.outputs.release_needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_architecture: amd64
            rpm_architecture: x86_64
            artifact: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_architecture: arm64
            rpm_architecture: aarch64
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Build DEB and RPM
        run: >-
          cargo run --locked --package ahcl-kit-dist --
          linux
          --target '${{ matrix.target }}'
          --deb-architecture '${{ matrix.deb_architecture }}'
          --rpm-architecture '${{ matrix.rpm_architecture }}'
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux]
    if: needs.version.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* | sort -k2 > SHA256SUMS
          cd ..

          previous_tag="$(git tag --sort=-version:refname | head -n 1)"
          args=(--method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          if [[ -n "$previous_tag" ]]; then args+=(-f "previous_tag_name=$previous_tag"); fi
          generated_notes="$(gh api "${args[@]}" --jq .body)"

          cat > release-notes.md <<EOF
          AHCL Kit initializes, generates, and maintains AHCL materials for projects.

          ## Installation assets

          - Windows x64 and ARM64: MSI packages
          - macOS Intel and Apple Silicon: Universal PKG
          - Debian/Ubuntu x86-64 and ARM64: DEB packages
          - RPM-based Linux x86-64 and ARM64: RPM packages
          - File digests: \`SHA256SUMS\`

          $generated_notes
          EOF
      - name: Publish tag and release
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "AHCL Kit $TAG" \
            --notes-file release-notes.md
