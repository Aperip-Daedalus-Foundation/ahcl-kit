[alias]
fmt-check = "fmt --all -- --check"
check-all = "check --locked --workspace --all-targets"
clippy-all = "clippy --locked --workspace --all-targets --all-features -- -D warnings"
test-all = "test --locked --workspace --all-targets"
build-workspace = "build --locked --workspace"
build-ahcl = "build --locked --package ahcl-kit --bin ahcl"
build-release = "build --locked --release --package ahcl-kit --bin ahcl"

exe-windows-x64 = "build --locked --release --target x86_64-pc-windows-msvc --package ahcl-kit --bin ahcl"
exe-windows-arm64 = "build --locked --release --target aarch64-pc-windows-msvc --package ahcl-kit --bin ahcl"
exe-macos-x64 = "build --locked --release --target x86_64-apple-darwin --package ahcl-kit --bin ahcl"
exe-macos-arm64 = "build --locked --release --target aarch64-apple-darwin --package ahcl-kit --bin ahcl"
exe-linux-x64 = "build --locked --release --target x86_64-unknown-linux-gnu --package ahcl-kit --bin ahcl"
exe-linux-arm64 = "build --locked --release --target aarch64-unknown-linux-gnu --package ahcl-kit --bin ahcl"

pkg-windows-x64 = "run --locked --package ahcl-kit-dist -- windows --architecture x64 --target x86_64-pc-windows-msvc"
pkg-windows-arm64 = "run --locked --package ahcl-kit-dist -- windows --architecture arm64 --target aarch64-pc-windows-msvc"
pkg-macos = "run --locked --package ahcl-kit-dist -- macos"
pkg-linux-x64 = "run --locked --package ahcl-kit-dist -- linux --target x86_64-unknown-linux-gnu --deb-architecture amd64 --rpm-architecture x86_64"
pkg-linux-arm64 = "run --locked --package ahcl-kit-dist -- linux --target aarch64-unknown-linux-gnu --deb-architecture arm64 --rpm-architecture aarch64"
