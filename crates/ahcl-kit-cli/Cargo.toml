[package]
name = "ahcl-kit-cli"
version.workspace = true
description.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "ahcl_kit_cli"
path = "src/lib.rs"

[[bin]]
name = "ahcl"
path = "src/main.rs"

[dependencies]
ahcl-kit-cargo = { path = "../ahcl-kit-cargo" }
ahcl-kit-config = { path = "../ahcl-kit-config" }
ahcl-kit-core = { path = "../ahcl-kit-core" }
ahcl-kit-license = { path = "../ahcl-kit-license" }
ahcl-kit-materials = { path = "../ahcl-kit-materials" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.44", default-features = false, features = ["std"] }

[build-dependencies]
toml = "=0.8.23"
winresource = "=0.1.31"
